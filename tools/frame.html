<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>frame</title>
<style>
  :root{
    --gold:#D8B074; --gold-soft:#E7CB97;
    --ink:#0B0B0C; --light:#F4EFE6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  .stage{
    position:relative; width:1600px; height:1000px; overflow:hidden;
    background:
      radial-gradient(closest-side at 50% 44%, rgba(216,176,116,.20), rgba(216,176,116,0) 72%),
      radial-gradient(120% 90% at 80% -10%, rgba(120,90,40,.18), rgba(0,0,0,0) 60%),
      linear-gradient(165deg, #121113 0%, #0B0A0B 55%, #080708 100%);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  /* vignette */
  .stage::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%);
  }

  /* ---- phone ---- */
  .phone{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:422px; height:886px; padding:13px; border-radius:60px;
    background:linear-gradient(160deg,#26262b,#0d0d10 40%,#1b1b1f);
    box-shadow:
      0 2px 2px rgba(255,255,255,.06) inset,
      0 0 0 1px rgba(0,0,0,.6),
      0 60px 90px -20px rgba(0,0,0,.7),
      0 30px 120px -10px rgba(216,176,116,.16);
  }
  .screen{
    position:relative; width:100%; height:100%;
    border-radius:47px; overflow:hidden; background:#0B0B0C;
  }
  .screen img{width:100%; height:100%; object-fit:cover; display:block}

  /* opaque-to-faded band that kills the real status bar + DEBUG ribbon */
  .statusmask{
    position:absolute; top:0; left:0; right:0; height:90px; z-index:3;
    background:linear-gradient(180deg,#0B0B0C 0%,#0B0B0C 56%,rgba(11,11,12,0) 100%);
  }
  .island{
    position:absolute; top:13px; left:50%; transform:translateX(-50%);
    width:112px; height:31px; border-radius:16px; background:#000; z-index:6;
  }
  .sb{ position:absolute; top:16px; z-index:7; color:#fff;
       font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; }
  .sb-time{ left:30px; font-weight:600; font-size:17px; letter-spacing:.2px }
  .sb-icons{ right:26px; display:flex; align-items:center; gap:7px }
  .sb-icons svg{ display:block }

  /* ---- branding ---- */
  .brand{ position:absolute; left:72px; bottom:60px; z-index:8 }
  .brand .name{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:30px; color:var(--light); letter-spacing:.5px; line-height:1;
  }
  .brand .sub{
    margin-top:9px; font-size:11px; letter-spacing:4px; text-transform:uppercase;
    color:rgba(244,239,230,.45);
  }
  .label{
    position:absolute; right:72px; bottom:62px; z-index:8;
    display:flex; align-items:center; gap:10px;
  }
  .label .dot{ width:7px; height:7px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 12px rgba(216,176,116,.8) }
  .label .txt{
    font-size:13px; letter-spacing:3.5px; text-transform:uppercase;
    color:var(--gold-soft); font-weight:600;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <img id="shot" alt="">
        <div class="statusmask"></div>
        <div class="island"></div>
        <div class="sb sb-time" id="time">9:41</div>
        <div class="sb sb-icons">
          <!-- cellular -->
          <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#fff">
            <rect x="0"  y="8"  width="3" height="4" rx="1"/>
            <rect x="5"  y="5.5" width="3" height="6.5" rx="1"/>
            <rect x="10" y="3"  width="3" height="9" rx="1"/>
            <rect x="15" y="0.5" width="3" height="11.5" rx="1"/>
          </g></svg>
          <!-- wifi -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
            <path d="M8.5 11.2 11 8.3a3.6 3.6 0 0 0-5 0l2.5 2.9Z" fill="#fff"/>
            <path d="M2.7 5.2a8.5 8.5 0 0 1 11.6 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M5 7.6a5 5 0 0 1 7 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <!-- battery -->
          <svg width="27" height="13" viewBox="0 0 27 13">
            <rect x="0.6" y="0.6" width="22" height="11.8" rx="3.2" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
            <rect x="2.2" y="2.2" width="17" height="8.6" rx="2" fill="#fff"/>
            <rect x="24" y="4" width="2.2" height="5" rx="1.1" fill="#fff" fill-opacity=".5"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="brand">
      <div class="name" id="brand">Atelier</div>
      <div class="sub" id="tagline">AI Photo Studio</div>
    </div>
    <div class="label">
      <span class="dot"></span>
      <span class="txt" id="label">AI EDITOR</span>
    </div>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const img = q.get('img');
    if (img) document.getElementById('shot').src = img;
    const set = (id, key) => { const v = q.get(key); if (v !== null) document.getElementById(id).textContent = v; };
    set('label','label'); set('brand','brand'); set('tagline','tagline'); set('time','time');
  </script>
</body>
</html>
